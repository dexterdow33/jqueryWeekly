# GSR Collector configuration. Edit this file; no code changes needed.
#
# VERIFY markers: these endpoints and pages could not be opened from the
# session that built this tool (network blocked). Run
#   python -m gsr_collector --dry-run
# once and read the report before trusting a source.

archive_root: ~/GSR_Archive      # local archive folder; scripts/sync_to_drive.sh pushes it to Google Drive

http:
  # Identifies GSR to every server. GSR-facing address only.
  user_agent: "GSR-Collector/1.0 (+Granite State Report; granitestatereport@gmail.com)"
  delay_seconds: 1.5             # minimum gap between requests to the same host
  timeout_seconds: 90
  max_retries: 3
  obey_robots: true              # leave on

limits:
  max_downloads_per_run: 200
  max_file_mb: 1024              # single-file cap; raise for bulk datasets
  max_run_gb: 20                 # stop downloading once a run pulls this much
  allowed_extensions: [pdf, csv, xls, xlsx, doc, docx, zip, json, xml, txt]

scoring:
  min_score: 5                   # raise to be pickier, lower to harvest more
  nh_bonus: 4
  nh_terms: ["New Hampshire", "N.H.", "Granite State", "Concord, NH", "Manchester, NH", "Nashua"]
  file_type_bonus: {pdf: 1, csv: 2, xlsx: 2, xls: 2, zip: 1, json: 1}
  # Folder names = GSR categories (from GSR_Category_Plan_v1_2026-09-29).
  beats:
    Right_to_Know:
      [right-to-know, "right to know", "91-A", public records, records request, FOIA,
       freedom of information, transparency, redaction, open meetings, nonpublic session]
    Courts:
      [supreme court, superior court, circuit court, opinion, ruling, docket, judicial,
       sentencing, annulment, criminal record, appeal, judge]
    Legislative_Watch:
      [bill, house bill, senate bill, legislature, general court, roll call, statute,
       amendment, RSA, committee, hearing]
    Constitutional_Law:
      [constitution, constitutional, first amendment, due process, equal protection,
       constitutional convention, civil rights]
    Privacy_and_Surveillance:
      [surveillance, privacy, wiretap, eavesdropping, facial recognition, license plate reader,
       body camera, data breach, personal information]
    Technology_AI:
      [artificial intelligence, "AI", algorithm, automated decision, machine learning, vendor contract]
    Public_Health_and_Safety:
      [public health, mental health, involuntary emergency admission, opioid, overdose,
       Medicaid, SNAP, homelessness, department of safety, police, state police]
    Economic_Inequality:
      [poverty, wages, housing, eviction, rent, income, inequality, child care, affordable housing]
    Government_Accountability:
      [audit, inspector general, investigation, misconduct, ethics, contract, procurement,
       budget, spending, grant, campaign finance]
    Press_Freedom:
      [press freedom, journalist, reporter, subpoena, shield law, defamation, free speech]

sources:
  ckan:
    enabled: true
    portals:
      - name: data_gov
        base_url: https://catalog.data.gov        # VERIFY: CKAN Action API at /api/3/action/package_search
        rows: 50
        formats: [csv, xlsx, xls, json, zip, pdf]
        queries: ['"New Hampshire"', '"New Hampshire" police', '"New Hampshire" health',
                  '"New Hampshire" housing', '"New Hampshire" education spending']

  federal_register:
    enabled: true                                 # VERIFY: federalregister.gov/api/v1, no key
    rows: 50
    queries: ['"New Hampshire"', '"Freedom of Information Act"', '"Privacy Act" system of records',
              'surveillance', '"artificial intelligence" government']

  courtlistener:
    enabled: true                                 # VERIFY: API v4; set COURTLISTENER_TOKEN for higher limits
    courts: [nh, nhd]                             # VERIFY: nh = NH Supreme Court, nhd = D.N.H.
    score_bonus: 4                                # every hit is an NH court, so count it as NH
    default_beat: Courts
    rows: 25
    queries: ['"right-to-know"', '"91-A"', '"public records"', 'surveillance', '"free speech"',
              '"first amendment"', 'privacy']

  internet_archive:
    enabled: true                                 # VERIFY: archive.org advancedsearch + metadata API
    rows: 25
    extensions: [pdf, csv, xlsx, zip]
    queries: ['title:("New Hampshire") AND mediatype:texts',
              '"New Hampshire" AND (report OR audit OR legislature) AND mediatype:texts']

  # Sites with no API. Pages are followed on the seed's own domain only;
  # document links pointing to other domains are still collected.
  # VERIFY every seed URL in a browser, then point it at the page that lists
  # the documents you want (reports, minutes, audits) instead of the home page.
  crawler:
    enabled: true
    max_pages_per_seed: 150
    score_bonus: 4                                # seeds are NH government sites
    extensions: [pdf, csv, xls, xlsx, doc, docx, zip]
    seeds:
      - name: nh_general_court
        url: https://gc.nh.gov/                   # VERIFY
        publisher: NH General Court
        depth: 1
      - name: nh_judicial_branch
        url: https://www.courts.nh.gov/           # VERIFY
        publisher: NH Judicial Branch
        depth: 1
      - name: nh_doj
        url: https://www.doj.nh.gov/              # VERIFY
        publisher: NH Department of Justice
        depth: 1
